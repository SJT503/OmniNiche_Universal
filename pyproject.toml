[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniniche"
version = "2.0.0"
description = "OmniNiche v2.0: Universal Multi-Agent Clinical Auditing, Single-Cell GRN Perturbation, and Deconfounded Stochastic Multicellular Niche Dynamics Platform"
readme = "docs/DESIGN_SPEC_v2.0.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
omniniche = "omniniche.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omniniche*"]

[tool.setuptools.package-data]
"omniniche.disease_packs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
