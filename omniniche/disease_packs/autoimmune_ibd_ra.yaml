pack_id: autoimmune_ibd_ra
display_name: "Autoimmune Mucosal & Synovial Remodeling (Ulcerative Colitis / Crohn's / RA)"
archetype: relapsing_compensatory_stromal_escape
organ_system: Gut_Mucosa_and_Synovium
time_scale: weeks_to_months

clinical_query_spec:
  condition_terms:
    - "Ulcerative Colitis"
    - "Crohn Disease"
    - "Inflammatory Bowel Disease"
    - "Rheumatoid Arthritis"
  exclusion_terms:
    - "Traumatic Brain Injury"
    - "Epilepsy"
    - "Infectious Gastroenteritis"
  stages:
