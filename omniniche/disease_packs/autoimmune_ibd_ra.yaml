    mAb: [0.68, 0.74, 0.56, 0.35]
    ADC: [0.55, 0.60, 0.45, 0.28]
    ASO_siRNA: [0.48, 0.52, 0.40, 0.25]

cell_ontology_map:
  Infiltrating_Myeloid:
    - "OSM_Inflammatory_Monocyte"
    - "IL1B_Macrophage"
    - "Neutrophil"
  Inflammatory_Fibroblast:
    - "OSMR_IL11_CHI3L1_Fibroblast"
    - "THY1_Sublining_Fibroblast"
    - "Inflammatory Stromal"
  Effector_Th17_T:
    - "IL17A_IL23R_Th17"
    - "Tissue-Resident_Memory_T"
  Mucosal_Epithelium_Endothelium:
    - "Colonocyte"
    - "Crypt Epithelial"
    - "ACKR1_Venular_Endothelial"

clinical_anchors:
  positive_approved_or_phase3_wins:
    - "Upadacitinib (oral JAK1 inhibitor penetrating anti-TNF-refractory stromal STAT3 escape)"
    - "Risankizumab / Guselkumab (selective IL-23p19 blockade)"
    - "Guselkumab + Golimumab combination (VEGA trial dual-pathway synergy in UC)"
  negative_scientific_failures:
    - "Vixarelimab (NCT06137183 anti-OSMRbeta mAb Phase 2 termination in heavily pretreated fibrotic UC)"
    - "Cobitolimod / Mongersen (Phase 3 luminal oligonucleotide delivery failures)"
    - "Secukinumab in Crohn's disease (paradoxical epithelial barrier exacerbation by IL-17A blockade)"
